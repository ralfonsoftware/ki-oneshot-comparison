name: EnergyTracker
options:
  bundleIdPrefix: com.ralfehlert
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
configs:
  Debug: debug
  Personal: release
  Release: release
packages:
  EnergyCore:
    path: Packages/EnergyCore
targets:
  EnergyTracker:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: EnergyTracker
        excludes:
          - "Widgets/**"
          - "Resources/Info-Widget.plist"
          - "Resources/*.entitlements"
    dependencies:
      - package: EnergyCore
      - target: EnergyTrackerWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralfehlert.EnergyTracker
        INFOPLIST_FILE: EnergyTracker/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: EnergyTracker/Resources/EnergyTracker-Production.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: EnergyTracker/Resources/EnergyTracker-Debug.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Personal:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PERSONAL
    scheme:
      testTargets:
        - EnergyTrackerTests
        - EnergyTrackerUITests
  EnergyTrackerWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: EnergyTracker/Shared
      - path: EnergyTracker/Widgets
      - path: EnergyTracker/Resources/Localizable.xcstrings
      - path: EnergyTracker/Resources/InfoPlist.xcstrings
    dependencies:
      - package: EnergyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralfehlert.EnergyTracker.widgets
        INFOPLIST_FILE: EnergyTracker/Resources/Info-Widget.plist
        CODE_SIGN_ENTITLEMENTS: EnergyTracker/Resources/Widgets-Production.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: EnergyTracker/Resources/Widgets-Debug.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Personal:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PERSONAL
  EnergyTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/EnergyTrackerTests
    dependencies:
      - target: EnergyTracker
      - package: EnergyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralfehlert.EnergyTracker.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EnergyTracker.app/EnergyTracker
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  EnergyTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/EnergyTrackerUITests
    dependencies:
      - target: EnergyTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralfehlert.EnergyTracker.uitests
        TEST_TARGET_NAME: EnergyTracker
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EnergyTracker:
    build:
      targets:
        EnergyTracker: all
        EnergyTrackerWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EnergyTrackerTests
        - EnergyTrackerUITests
    archive:
      config: Release
  Personal:
    build:
      targets:
        EnergyTracker: all
        EnergyTrackerWidgets: all
    run:
      config: Personal
    archive:
      config: Personal
